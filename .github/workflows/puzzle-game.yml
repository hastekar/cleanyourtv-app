# Lumo Match (puzzle-game/) and Magnificent Match (magnificent-match/): tests, level regeneration check, web build, browser end-to-end
# test and the Android packages. Runs only when the game changes. Nothing is signed here.
name: puzzle-game

on:
  push:
    paths: ["puzzle-game/**", "magnificent-match/**", ".github/workflows/puzzle-game.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        game: [puzzle-game, magnificent-match]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Unit tests (engine, all 60 level proofs, save file)
        run: npm test

      - name: Shipped levels are exactly what the generator produces
        run: npm run levels && git diff --exit-code -- src/levels

      - run: npm run build

      - name: Browser end-to-end test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Android debug APK and unsigned release bundle
        run: |
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug bundleRelease :app:lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.game }}-android
          path: |
            ${{ matrix.game }}/android/app/build/outputs/apk/debug/*.apk
            ${{ matrix.game }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.game }}-web
          path: ${{ matrix.game }}/dist
          if-no-files-found: error
