<title>Memleket Fethi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Düzen: 1080x1920 dikey yayın (PLAN bölüm 3). Dikey konumlar yüzde, yazı boyları --u (1u = genişliğin %1'i) ile.
   Güvenli alanlar: --safe-top / --safe-bottom / --safe-right. */
:root{
  color-scheme: dark;
  --deniz:#0b2230;
  --deniz-2:#123748;
  --mürekkep:#06141c;
  --kağıt:#f6ecd4;
  --soluk:#a9c0c4;
  --altın:#f2b632;
  --çini:#27c2b3;
  --al:#e2403a;
  --panel:rgba(6,20,28,.8);
  --çizgi:rgba(246,236,212,.18);
  --c0:#e8553a;
  --c1:#3ac2e8;
  --display:"Lilita One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-top:11%;      /* TikTok üst çubuğu: boş */
  --safe-bottom:36%;   /* sohbet akışı + yorum çubuğu: önemli hiçbir şey yok */
  --safe-right:12%;    /* hediye/beğeni animasyonları (%45-78 yükseklik) */
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  --u:min(1vw,.5625vh);
}
@media (min-aspect-ratio:1/1){
  :root{ --safe-top:2%; --safe-bottom:12%; --safe-right:0%; --u:.8vh; }
}
html,body{height:100%}
body{margin:0;background:var(--deniz);color:var(--kağıt);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:linear-gradient(#1d3238,#3a5256 60%,#2f4b2d);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#hud{position:absolute;inset:0;box-sizing:border-box;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:calc(var(--u)*2.8)}
.hin{position:relative;width:100%;height:100%}
#hud button,#hud input{pointer-events:auto}
[hidden]{display:none!important}

/* ── üst bant: %11-19 can/sayaç, %19-24 ipucu ── */
#hudtop{position:absolute;top:var(--safe-top);left:50%;transform:translateX(-50%);width:min(100%,calc(var(--u)*94));display:grid;gap:calc(var(--u)*.4)}
.tb{display:grid;grid-template-columns:1fr auto 1fr;gap:calc(var(--u)*1.2);align-items:stretch}
.sd{background:var(--panel);border-radius:calc(var(--u)*1.2);border-top:calc(var(--u)*.6) solid var(--sc);padding:calc(var(--u)*.6) calc(var(--u)*1.2) calc(var(--u)*.6);
  display:grid;gap:calc(var(--u)*.4);min-width:0;box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(0,0,0,.35)}
.sd .nm{display:flex;align-items:center;gap:calc(var(--u)*.8);min-width:0;font-family:var(--display);line-height:1;font-size:calc(var(--u)*3.6);white-space:nowrap}
.sd .nm i{font-style:normal;background:var(--sc);color:var(--mürekkep);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.25) calc(var(--u)*.8);font-size:.92em}
.sd .nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis;text-shadow:0 calc(var(--u)*.2) 0 var(--mürekkep)}
.sd .nm b.long{font-size:.82em}
.sd .hp{display:flex;align-items:center;gap:calc(var(--u)*1);min-width:0}
.sd .hp strong{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*4.6);line-height:1;font-variant-numeric:tabular-nums;min-width:4.3ch;text-shadow:0 calc(var(--u)*.2) 0 var(--mürekkep)}
.bar{flex:1;height:calc(var(--u)*2.4);border-radius:calc(var(--u)*1.2);background:var(--mürekkep);border:calc(var(--u)*.3) solid var(--kağıt);overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--sc);transform-origin:left;transition:transform .25s}
#s1 .bar i{left:auto;right:0;transform-origin:right}
.bdg{display:flex;gap:calc(var(--u)*.6);height:calc(var(--u)*3.1);overflow:hidden;white-space:nowrap}
.bdg span{font-weight:800;font-size:calc(var(--u)*2.5);line-height:calc(var(--u)*3.1);padding:0 calc(var(--u)*.9);border-radius:calc(var(--u)*1.6);color:var(--kağıt);background:var(--al)}
.bdg .sh{background:var(--çini);color:var(--mürekkep)}
.bdg .bf{background:var(--altın);color:var(--mürekkep)}
.bdg .st{background:var(--kağıt);color:var(--mürekkep)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--u)*.7);min-width:calc(var(--u)*16)}
#timer{font-family:var(--display);font-size:calc(var(--u)*6);line-height:1;font-variant-numeric:tabular-nums;background:var(--al);color:var(--kağıt);
  padding:calc(var(--u)*.5) calc(var(--u)*1.4);border-radius:calc(var(--u)*1.2);box-shadow:0 calc(var(--u)*.4) 0 #7c1512}
#timer.hot{animation:blink .6s steps(2) infinite}
#timer.ot{background:var(--altın);color:var(--mürekkep);box-shadow:0 calc(var(--u)*.4) 0 #8a5a00}
@keyframes blink{50%{background:#7c1512}}
#x2{font-weight:800;font-size:calc(var(--u)*2.5);line-height:calc(var(--u)*3.1);background:var(--altın);color:var(--mürekkep);border-radius:calc(var(--u)*1.6);padding:0 calc(var(--u)*1);animation:blink .6s steps(2) infinite}
#tug{display:flex;height:calc(var(--u)*1.4);border-radius:calc(var(--u)*.8);overflow:hidden;background:var(--mürekkep);border:calc(var(--u)*.25) solid var(--kağıt);position:relative}
#tug i{display:block;height:100%;transition:width .3s}
#tug i:first-child{background:var(--c0)}
#tug i:last-child{background:var(--c1);flex:1}
#tug:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:calc(var(--u)*.3);background:var(--kağıt);opacity:.8;transform:translateX(-50%)}
.line{height:calc(var(--u)*3.1);line-height:calc(var(--u)*3.1);text-align:center;font-weight:700;font-size:calc(var(--u)*2.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  width:fit-content;max-width:100%;margin:0 auto;padding:0 calc(var(--u)*1.6);border-radius:calc(var(--u)*1.7);background:rgba(6,20,28,.72)}
#tip{color:var(--kağıt)}
#tip b{color:var(--altın)}
#tip.sw{animation:tipin .5s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(calc(var(--u)*-1))}to{opacity:1;transform:none}}
#que{color:var(--soluk)}
#que b{color:var(--çini);font-weight:800}

/* ── destekçiler: başlık kutusunun altında ── */
.t3{display:flex;gap:calc(var(--u)*.7);height:calc(var(--u)*3.8);overflow:hidden;align-items:center}
.ch{display:flex;align-items:center;gap:calc(var(--u)*.3);min-width:0;font-size:calc(var(--u)*2.4);font-weight:700;white-space:nowrap}
.ch b{max-width:calc(var(--u)*5.5);overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ch em{font-style:normal;color:var(--altın);font-weight:800;font-variant-numeric:tabular-nums}
.av{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;display:grid;place-items:center;font:400 calc(var(--u)*2.1)/1 var(--display);color:var(--mürekkep);
  background:var(--c,var(--al)) center/cover no-repeat;border:calc(var(--u)*.25) solid var(--kağıt);box-sizing:border-box;flex:none;text-decoration:none}
.map{display:block;width:calc(var(--u)*46);max-width:100%;height:auto;margin:calc(var(--u)*1) auto 0;background:rgba(10,30,42,.6);border-radius:calc(var(--u)*1)}
#tip.fd{color:var(--kağıt);box-shadow:inset calc(var(--u)*.6) 0 0 var(--c,var(--altın))}

/* ── rütbe kartı: tek satırlık hap, solda ── */
#card{position:absolute;left:0;top:58%;max-width:56%;display:flex;align-items:center;gap:calc(var(--u)*1);background:var(--panel);border-radius:calc(var(--u)*3);
  padding:calc(var(--u)*.5) calc(var(--u)*1.6) calc(var(--u)*.5) calc(var(--u)*.5);border:calc(var(--u)*.3) solid var(--c,var(--altın));font-size:calc(var(--u)*2.6);white-space:nowrap;animation:cardin .3s ease-out}
#card .av{width:calc(var(--u)*5);height:calc(var(--u)*5);font-size:calc(var(--u)*2.6)}
#card b{font-family:var(--display);font-weight:400;font-size:1.15em;flex:none;max-width:calc(var(--u)*15);overflow:hidden;text-overflow:ellipsis}
#card i{font-style:normal;color:var(--altın);font-weight:800;flex:none}
#card span{overflow:hidden;text-overflow:ellipsis;color:var(--çini);font-weight:700}
@keyframes cardin{from{transform:translateX(calc(var(--u)*-4));opacity:0}to{transform:none;opacity:1}}

/* ── afiş ── */
#banner{position:absolute;left:50%;top:28.5%;transform:translateX(-50%);text-align:center;width:min(100%,calc(var(--u)*94))}
#banner div{display:inline-block;font-family:var(--display);font-size:calc(var(--u)*6);line-height:1.04;color:var(--kağıt);padding:calc(var(--u)*.6) calc(var(--u)*2);background:rgba(6,20,28,.78);border-radius:calc(var(--u)*1.4);border-bottom:calc(var(--u)*.5) solid var(--c,var(--al));
  text-shadow:0 calc(var(--u)*.5) 0 var(--mürekkep),0 0 calc(var(--u)*2) var(--c,var(--al)),0 0 calc(var(--u)*.6) #000;animation:pop 2.7s ease-out forwards;text-wrap:balance}
#banner small{display:block;font-family:var(--body);font-weight:800;font-size:calc(var(--u)*3);color:var(--altın);margin-top:calc(var(--u)*.3)}
@keyframes pop{0%{transform:scale(.4);opacity:0}9%{transform:scale(1.12);opacity:1}16%{transform:scale(1)}86%{opacity:1}100%{opacity:0}}

/* ── dünya içi etiketler ── */
.tag,.bub{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.tag{display:flex;align-items:center;gap:calc(var(--u)*.5);background:var(--kağıt);color:var(--mürekkep);border-radius:calc(var(--u)*2.2);padding:calc(var(--u)*.25) calc(var(--u)*1.1) calc(var(--u)*.25) calc(var(--u)*.25);
  font-weight:800;font-size:calc(var(--u)*2.4);line-height:1.1;box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1) rgba(0,0,0,.5)}
.tag .av{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);font-size:calc(var(--u)*1.9);border-width:calc(var(--u)*.2)}
.tag span{max-width:calc(var(--u)*10);overflow:hidden;text-overflow:ellipsis}
.tag small{font-weight:600;font-size:.85em;opacity:.7}
.tag.mini{padding-right:calc(var(--u)*.25)}
.tag.mini span,.tag.mini small{display:none}
.bub{margin-top:calc(var(--u)*-4.6);background:#fff;color:var(--mürekkep);font-weight:500;font-size:calc(var(--u)*2.6);line-height:1.2;
  padding:calc(var(--u)*.5) calc(var(--u)*1.3);border-radius:calc(var(--u)*1.6) calc(var(--u)*1.6) calc(var(--u)*1.6) calc(var(--u)*.3);max-width:calc(var(--u)*34);overflow:hidden;text-overflow:ellipsis;box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1) rgba(0,0,0,.5);z-index:2}

/* ── giriş ve tören ── */
.ov{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:min(100%,calc(var(--u)*94));text-align:center;background:rgba(6,20,28,.8);border:1px solid var(--çizgi);
  border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.4) calc(var(--u)*2);box-sizing:border-box;box-shadow:0 0 calc(var(--u)*4) rgba(0,0,0,.5)}
.ov h2{margin:0;font:400 calc(var(--u)*4)/1 var(--display);color:var(--çini);letter-spacing:.08em}
.ov .vs{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);margin:calc(var(--u)*1.4) 0}
.ov .vs div{font:400 calc(var(--u)*5)/1.05 var(--display);text-shadow:0 calc(var(--u)*.4) 0 var(--mürekkep);flex:1;min-width:0;overflow-wrap:anywhere}
.ov .vs div i{display:block;font-style:normal;font-size:.7em;color:var(--sc)}
.ov .vs b{font:400 calc(var(--u)*6)/1 var(--display);color:var(--altın)}
.ov .row{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*4)}
.ov .row .map{width:calc(var(--u)*34);margin:0}
.ov .cd{font:400 calc(var(--u)*9)/1 var(--display);color:var(--altın);text-shadow:0 calc(var(--u)*.5) 0 #8a5a00}
.ov p{margin:calc(var(--u)*.8) 0 0;font-size:calc(var(--u)*2.9);font-weight:700;color:var(--kağıt)}
.ov p.s{color:var(--soluk);font-weight:500}
#endc .w{font:400 calc(var(--u)*8)/1 var(--display);color:var(--sc);text-shadow:0 calc(var(--u)*.5) 0 var(--mürekkep);margin:calc(var(--u)*.6) 0;overflow-wrap:anywhere}
#endc .fa{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);margin:calc(var(--u)*.6) 0;text-align:left}
#endc .fa .av{width:calc(var(--u)*10);height:calc(var(--u)*10);font-size:calc(var(--u)*5);border-width:calc(var(--u)*.5);border-color:var(--altın)}
#endc .fa small{display:block;font-weight:800;font-size:calc(var(--u)*2.6);color:var(--altın);letter-spacing:.1em}
#endc .fa b{display:block;font:400 calc(var(--u)*5.2)/1.05 var(--display)}
#endc ol{list-style:none;margin:calc(var(--u)*1) auto 0;padding:0;display:grid;gap:calc(var(--u)*.5);width:min(100%,calc(var(--u)*60));font-weight:700;font-size:calc(var(--u)*2.9)}
#endc li{display:grid;grid-template-columns:calc(var(--u)*3) calc(var(--u)*4.2) 1fr auto;gap:calc(var(--u)*1);align-items:center;text-align:left}
#endc li b{font-family:var(--display);font-weight:400;color:var(--altın)}
#endc li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#endc li em{font-style:normal;color:var(--altın)}

/* ── yayıncı araç çubuğu ── */
#bar{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:max(12px,calc(var(--u)*2.5))}
#bar label{color:var(--soluk);font-weight:700}
button{font:700 1em var(--body);color:var(--kağıt);background:rgba(6,20,28,.88);border:1px solid var(--çizgi);border-radius:8px;padding:.42em .7em;cursor:pointer}
button:hover{border-color:var(--altın)}
button:focus-visible,input:focus-visible{outline:2px solid var(--altın);outline-offset:2px}
button[aria-pressed="true"]{background:var(--çini);color:var(--mürekkep);border-color:transparent}
#bar input[type=range]{width:5.5em;accent-color:var(--çini)}
#test-plate{width:3.6em;font:700 1em var(--body);color:var(--kağıt);background:var(--mürekkep);border:1px solid var(--çizgi);border-radius:8px;padding:.4em}
#status{color:var(--soluk);font-weight:500;background:rgba(6,20,28,.7);border-radius:6px;padding:.2em .5em}
.obs #bar{display:none}

/* ── model galerisi ── */
#gal{position:absolute;left:50%;bottom:max(120px,15%);transform:translateX(-50%);width:min(94%,30em);text-align:center;background:var(--panel);border:1px solid var(--çizgi);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:max(14px,calc(var(--u)*2.8))}
#gal h3{font:400 1.7em/1.1 var(--display);margin:0;color:var(--altın)}
#gal p{margin:0;line-height:1.35}
#gal .trig{font-weight:800;color:var(--çini)}
#gal nav{display:flex;gap:8px;justify-content:center;margin-top:4px}
.ph-intro #card,.ph-intro #labels,.ph-end #labels,.ph-end #banner,.ph-end #card{display:none!important}
.ph-intro #banner{display:none}
.gal #hudtop,.gal #banner,.gal #card,.gal .ov,.gal #labels{display:none!important}

@media (min-aspect-ratio:1/1){
  .ov{top:22%} #banner{top:26%} #card{top:60%}
}
@media (prefers-reduced-motion:reduce){ .fi,#banner div,#card,#tip.sw{animation-duration:.01s} #timer.hot,#x2{animation:none} }
</style>

<div id="stage">
  <canvas id="gl" aria-label="İki şehrin kuşatma sahnesi"></canvas>
  <div id="labels"></div>
  <div id="hud"><div class="hin">
    <div id="hudtop">
      <div class="tb">
        <div class="sd" id="s0"><div class="nm"><i></i><b></b></div><div class="hp"><strong>0</strong><div class="bar"><i></i></div></div><div class="bdg"></div><div class="t3"></div></div>
        <div class="mid"><div id="timer">3:00</div><div id="x2" hidden>×2 HASAR</div></div>
        <div class="sd" id="s1"><div class="nm"><i></i><b></b></div><div class="hp"><strong>0</strong><div class="bar"><i></i></div></div><div class="bdg"></div><div class="t3"></div></div>
      </div>
      <div id="tug"><i style="width:50%"></i><i></i></div>
      <div class="line" id="tip"></div>
      <div class="line" id="que"></div>
    </div>
    <div id="banner"></div>
    <aside id="card" hidden></aside>
    <div class="ov" id="intro" hidden>
      <h2>SIRADAKİ KUŞATMA</h2>
      <div class="vs"><div id="i0"></div><b>⚔</b><div id="i1"></div></div>
      <div class="row"><div class="cd" id="icd">6</div><canvas class="map mapcv" id="mapintro" width="330" height="150"></canvas></div>
      <p>Yoruma plakanı yaz, kendi ilinin tarafında savaş!</p>
    </div>
    <div class="ov" id="endc" hidden></div>
    <canvas class="map mapcv" id="mapend" width="330" height="150"></canvas>
    <div id="gal" hidden>
      <h3 id="gal-name"></h3>
      <p class="trig" id="gal-trig"></p>
      <p id="gal-desc"></p>
      <nav><button id="gal-prev" type="button">Önceki</button><button id="gal-next" type="button">Sonraki</button><button id="gal-close" type="button">Oyuna dön</button></nav>
    </div>
    <div id="bar">
      <button id="b-sim" type="button" aria-pressed="true">Demo izleyiciler</button>
      <label for="test-plate">Plaka</label><input id="test-plate" type="number" min="1" max="81" value="34">
      <button data-t="like20" type="button">Beğeni ×20</button>
      <button data-t="g1" type="button">1 elmas</button>
      <button data-t="g30" type="button">30 elmas</button>
      <button data-t="g199" type="button">199 elmas</button>
      <button data-t="g1000" type="button">1000 elmas</button>
      <button data-t="follow" type="button">Takip</button>
      <button id="b-gal" type="button">Modeller</button>
      <button id="b-snd" type="button" aria-pressed="false">Ses</button>
      <button id="b-pron" type="button" title="Çavuş telaffuz varyantını sırayla dene; OBS adresine &amp;cavus=N ekle">Çavuş sesi 1/6</button>
      <label for="vol-m">Müzik</label><input id="vol-m" type="range" min="0" max="100" value="80" aria-label="Müzik sesi">
      <label for="vol-s">Efekt</label><input id="vol-s" type="range" min="0" max="100" value="90" aria-label="Efekt sesi">
      <span id="status">Demo modu</span>
    </div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/models.js"></script>
<script src="js/units.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
